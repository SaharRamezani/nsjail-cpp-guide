name: "cpp-sandbox"
mode: ONCE

# Sandbox environment name
hostname: "SANDBOX"
cwd: "/tmp"

# Resource limits
time_limit: 30
max_cpus: 1
rlimit_as: 512       # 512 MB memory limit
rlimit_cpu: 10       # 10 seconds CPU time
rlimit_nofile: 32    # Max 32 open files
rlimit_fsize: 10     # Max 10 MB file size

# Enable namespace isolation
clone_newnet: true   # Network isolation
clone_newuser: true  # User namespace
clone_newns: true    # Mount namespace
clone_newpid: true   # PID namespace
clone_newipc: true   # IPC namespace
clone_newuts: true   # UTS namespace (hostname)

# User/Group mapping
uidmap {
  inside_id: "1000"
  outside_id: ""
  count: 1
}

gidmap {
  inside_id: "1000"
  outside_id: ""
  count: 1
}

# Filesystem mounts - read-only root
mount {
  src: "/"
  dst: "/"
  is_bind: true
  rw: false
}

# Required system mounts
mount {
  dst: "/proc"
  fstype: "proc"
  rw: false
}

mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  options: "size=10M"
}

mount {
  dst: "/dev"
  fstype: "tmpfs"
  rw: true
}

# Essential devices
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}

mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: true
}

mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: true
}

# Note: seccomp_string commented out due to Kafel syntax complexity
# Uncomment and customize if you need strict syscall filtering
# seccomp_string: "ALLOW { read, write, exit, exit_group } DEFAULT KILL"
