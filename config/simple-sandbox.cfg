name: "cpp-simple"
mode: ONCE

hostname: "SANDBOX"
cwd: "/tmp"

# Basic resource limits
time_limit: 10
rlimit_as: 256
rlimit_cpu: 5

# Namespace isolation
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true

# User mapping
uidmap {
  inside_id: "99999"
  outside_id: ""
  count: 1
}

gidmap {
  inside_id: "99999"
  outside_id: ""
  count: 1
}

# Minimal mounts
mount {
  src: "/"
  dst: "/"
  is_bind: true
  rw: false
}

mount {
  dst: "/proc"
  fstype: "proc"
}

mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
}
